# The AdGuard CLI blocker module of the `filters-agent` action. A workflow step runs this before the
# action: it installs a pinned, verified AdGuard CLI release and the module that drives it into the
# workspace, and outputs the manifest to pass to the action's `blockerModules` input.
#
# The release pins are the lab `Dockerfile`'s: bump URL and checksum together, in both places.
name: 'filters-agent AdGuard CLI module'
description: >-
    Installs the AdGuard CLI blocker module for the filters-agent action: the official AdGuard CLI
    release, checked against its checksum and AdGuard's signature, and the module that drives it.

inputs:
    path:
        description: >-
            Workspace-relative directory to install the module into.
        required: false
        default: .filters-agent/adguard-cli
    releaseUrl:
        description: >-
            AdGuard CLI release archive to install; change it together with releaseSha256.
        required: false
        default: https://github.com/AdguardTeam/AdGuardCLI/releases/download/v1.5.0-rc.1/adguard-cli-1.5.0-rc.1-linux-x86_64.tar.gz
    releaseSha256:
        description: >-
            SHA-256 of the release archive.
        required: false
        default: f782aa950be96ea6817d935bfe55a8f445bc972d10c4eee5b9db6c15a88dbfa1

outputs:
    manifest:
        description: >-
            Workspace-relative path of the module manifest; pass it to the action's blockerModules
            input.
        value: ${{ steps.install.outputs.manifest }}

runs:
    using: composite
    steps:
        - id: install
          shell: bash
          env:
              INSTALL_PATH: ${{ inputs.path }}
              RELEASE_URL: ${{ inputs.releaseUrl }}
              RELEASE_SHA256: ${{ inputs.releaseSha256 }}
          run: |
              set -euo pipefail
              relative="${INSTALL_PATH%/}"
              target="${GITHUB_WORKSPACE}/${relative}"
              mkdir -p "${target}"
              node "${GITHUB_ACTION_PATH}/fetch-adguard-cli.mjs" \
                  "${RELEASE_URL}" "${RELEASE_SHA256}" "${target}/bin"
              cp "${GITHUB_ACTION_PATH}/module.mjs" "${GITHUB_ACTION_PATH}/blocker-module.json" \
                  "${target}/"
              # The install lives in the analyzed checkout; keep it out of the checkout's status.
              if [[ -d "${GITHUB_WORKSPACE}/.git/info" ]]; then
                  echo "/${relative}/" >> "${GITHUB_WORKSPACE}/.git/info/exclude"
              fi
              echo "manifest=${relative}/blocker-module.json" >> "${GITHUB_OUTPUT}"
